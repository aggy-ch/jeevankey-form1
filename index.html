<style>
:root {
  --navy:    #0C447C;
  --navy-d:  #06233f;
  --navy-l:  #12579b;
  --green:   #3B6D11;
  --green-d: #24440a;
  --green-l: #539719;
  --white:   #ffffff;
  --off:     #8EDBF5;
  --ink:     #111b24;
  --ink-2:   #2c3a46;
  --ink-3:   #526371;
  --ink-4:   #8ea1b0;
  --wa:      #25D366;
  --wa-d:    #1aab53;
  --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --ease:    cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--off);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(12,68,124,0.08);
  padding: 36px 28px 28px;
}

/* ── Brand bar ── */
.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.brand-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-logo {
  font-size: 19px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: -.02em;
}
.brand-logo span { color: var(--green); }
.brand-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-4); }
.brand-tag { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

/* ── Language selector ── */
.lang-select {
  font-size: 12px;
  color: var(--ink-2);
  border: 1.5px solid #d2dbe1;
  border-radius: 6px;
  padding: 5px 8px;
  background: var(--white);
  cursor: pointer;
  font-family: var(--sans);
}

/* ── Steps ── */
.step { display: none; }
.step.active { display: block; animation: fadeUp .3s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.step-q {
  font-size: 19px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
  margin-bottom: 6px;
}
.step-hint {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 18px;
  line-height: 1.5;
}
.hi-name { color: var(--green); font-weight: 700; }

/* ── Field group labels (single-page layout) ── */
.field-label {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
  line-height: 1.3;
}
.field-group { margin-top: 22px; }

/* ── Text input ── */
.field-wrap { margin-bottom: 4px; }
.field-input {
  width: 100%;
  padding: 13px 14px;
  font-size: 15px;
  font-family: var(--sans);
  border: 1.5px solid #d2dbe1;
  border-radius: 8px;
  color: var(--ink);
  background: var(--white);
  transition: border-color .2s;
  outline: none;
}
.field-input:focus { border-color: var(--navy); }
.field-input.valid { border-color: var(--green); }

/* ── Phone wrap ── */
.phone-wrap { display: flex; }
.phone-code {
  padding: 13px 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  background: #edf2f5;
  border: 1.5px solid #d2dbe1;
  border-right: none;
  border-radius: 8px 0 0 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.field-input.phone-input { border-radius: 0 8px 8px 0; }

/* ── Validation message ── */
.val-msg { font-size: 12px; color: var(--green); margin-top: 6px; display: none; }
.val-msg.show { display: block; }
.val-msg.err { color: #d32f2f; }

/* ── Phone safety reassurance ── */
.phone-safety-note {
  font-size: 12px;
  color: var(--green-d);
  margin-top: 7px;
  line-height: 1.4;
  display: flex;
  align-items: flex-start;
  gap: 5px;
}
.phone-safety-note::before {
  content: '🔒';
  font-size: 11px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── Options (Q0 paradigm) — row layout ── */
.opts { display: flex; flex-direction: row; gap: 8px; margin-bottom: 4px; }
.opt {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  padding: 14px 8px;
  background: var(--white);
  border: 1.5px solid #d2dbe1;
  border-radius: 10px;
  cursor: pointer;
  font-family: var(--sans);
  text-align: center;
  transition: all .2s var(--ease);
  min-width: 0;
}
.opt:hover { border-color: var(--green-l); background: #fbfdfa; }
.opt.sel { border-color: var(--green); background: #f4faf0; }
.opt-icon { font-size: 22px; line-height: 1; }
.opt-body { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.opt-main { font-size: 12.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.opt.sel .opt-main { color: var(--green-d); }
.opt-sub { font-size: 9.5px; color: var(--ink-4); line-height: 1.3; }

.paradigm-note {
  font-size: 11px;
  color: var(--ink-4);
  line-height: 1.5;
  margin-top: 10px;
  text-align: center;
}

/* ── Consent notice ── */
.consent-note {
  font-size: 11px;
  color: var(--ink-4);
  line-height: 1.5;
  margin-top: 18px;
}

/* ── Next button ── */
.next-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 24px;
  margin-top: 16px;
  background: var(--navy);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s var(--ease);
  opacity: 0;
  pointer-events: none;
}
.next-btn.on { opacity: 1; pointer-events: all; }
.next-btn:hover { background: var(--navy-l); }
.next-arrow { transition: transform .2s; }
.next-btn:hover .next-arrow { transform: translateX(3px); }

.next-btn.wa-style {
  gap: 9px;
}
#btn-submit {
  opacity: 1;
  pointer-events: all;
  background: #a8b6bd;
}
#btn-submit:hover { background: #94a4ac; }
#btn-submit.on { background: var(--wa); }
#btn-submit.on:hover { background: var(--wa-d); }
.next-btn.wa-style svg { flex-shrink: 0; }

@keyframes jkShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-4px); }
  40%, 80% { transform: translateX(4px); }
}
.attn-flash { animation: jkShake .4s ease-in-out; }
.field-input.attn-flash { border-color: #d32f2f !important; }
#paradigm-opts.attn-flash .opt { border-color: #d32f2f; }

.disclaimer {
  font-size: 10.5px;
  color: var(--ink-4);
  line-height: 1.5;
  margin-top: 18px;
  text-align: center;
}

@media (max-width: 480px) {
  .wrap { padding: 24px 18px 20px; border-radius: 0; min-height: 100vh; }
  .step-q { font-size: 17px; }
}

/* ══════════════════════════════════════════════════
   HEIGHT BROADCAST — tells the Carrd parent iframe
   how tall this form actually is.
   Measures .wrap (the content card), NOT document.body —
   body has min-height:100vh and is viewport-dependent,
   which creates a feedback loop when the parent resizes
   the iframe (iframe resize → vh changes → body resize →
   re-broadcast → iframe resize again, unbounded).
   .wrap's height only changes when real content changes,
   so it's safe to measure and broadcast at fixed points
   only — never on a continuous observer.
   ══════════════════════════════════════════════════ */
function _broadcastHeight() {
  try {
    const wrap = document.querySelector('.wrap');
    const h = wrap ? wrap.offsetHeight : document.body.scrollHeight;
    window.top.postMessage({ type: 'resize', height: h }, '*');
  } catch(e) {}
}

function t() { return T[lang] || T.hi; }

/* ══════════════════════════════════════════════════
   LANGUAGE SWITCH
   ══════════════════════════════════════════════════ */
function setLang(l) {
  lang = l;
  document.getElementById('brand-tag').textContent = t().brand_tag;

  document.getElementById('q-paradigm').textContent = t().q_paradigm;
  document.getElementById('h-paradigm').textContent = t().h_paradigm;
  renderParadigmOpts();
  document.getElementById('paradigm-note').textContent = t().change_note;

  document.getElementById('lbl-name-field').textContent = t().lbl_name_field;
  document.getElementById('f-name').placeholder = t().placeholder_name;

  document.getElementById('lbl-phone-field').textContent = t().lbl_phone_field;
  document.getElementById('f-phone').placeholder = t().placeholder_phone;
  document.getElementById('phone-safety-note').textContent = t().phone_safety_note;

  document.getElementById('consent-note').textContent = t().consent_note;
  document.getElementById('btn-submit-label').textContent = t().btn_connect;
  document.getElementById('disclaimer-text').textContent = t().disclaimer;

  setTimeout(_broadcastHeight, 60);
}

/* ══════════════════════════════════════════════════
   FIELD VALIDATION — NAME
   ══════════════════════════════════════════════════ */
function onName(el) {
  const v = el.value.trim();
  D.name = v;
  const msg = document.getElementById('val-name');
  if (v.length >= 2) {
    el.classList.add('valid');
    msg.textContent = t().val_name_ok;
    msg.className = 'val-msg show';
    if (!_stepFired.name) {
      _stepFired.name = true;
      _gaEvent('jk_onboarding_step', {
        step: 'name_entered',
        event_category: 'onboarding_funnel',
        event_label: 'step_name'
      });
    }
  } else {
    el.classList.remove('valid');
    msg.className = 'val-msg';
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   FIELD VALIDATION — PHONE
   ══════════════════════════════════════════════════ */
function onPhone(el) {
  el.value = el.value.replace(/\D/g, '').slice(0, 10);
  const v = el.value;
  D.phone = v;
  const msg = document.getElementById('val-phone');
  if (v.length === 10 && /^[6-9]/.test(v)) {
    el.classList.add('valid');
    msg.textContent = t().val_phone_ok;
    msg.className = 'val-msg show';
    if (!_stepFired.phone) {
      _stepFired.phone = true;
      _gaEvent('jk_onboarding_step', {
        step: 'phone_entered',
        event_category: 'onboarding_funnel',
        event_label: 'step_phone'
      });
    }
  } else if (v.length === 10) {
    el.classList.remove('valid');
    msg.textContent = t().val_phone_err;
    msg.className = 'val-msg show err';
  } else {
    el.classList.remove('valid');
    msg.className = 'val-msg';
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   PARADIGM SELECTION
   ══════════════════════════════════════════════════ */
function renderParadigmOpts() {
  const container = document.getElementById('paradigm-opts');
  const opts = t().paradigm_opts;
  container.innerHTML = opts.map(o => `
    <button class="opt${D.paradigm === o.val ? ' sel' : ''}"
      onclick="pickParadigm(this,'${o.val}')" type="button">
      <span class="opt-icon">${o.icon}</span>
      <span class="opt-body">
        <span class="opt-main">${o.main}</span>
        <span class="opt-sub">${o.sub}</span>
      </span>
    </button>
  `).join('');
}

function pickParadigm(el, val) {
  D.paradigm = val;
  const opt = t().paradigm_opts.find(o => o.val === val);
  D.paradigmLabel = opt ? opt.main : val;
  document.querySelectorAll('#paradigm-opts .opt').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  if (!_stepFired.paradigm) {
    _stepFired.paradigm = true;
    _gaEvent('jk_onboarding_step', {
      step: 'paradigm_selected',
      paradigm: val,
      event_category: 'onboarding_funnel',
      event_label: 'step_paradigm'
    });
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   COMBINED VALIDATION — all three fields must be valid
   Also builds the live WhatsApp href and fires
   jk_onboarding_filled exactly once, the moment the
   form first becomes fully valid (before any click).
   ══════════════════════════════════════════════════ */
let _filledFired = false;

function checkAllValid() {
  const nameOk    = D.name.length >= 2;
  const phoneOk   = D.phone.length === 10 && /^[6-9]/.test(D.phone);
  const paradigmOk = !!D.paradigm;
  const allValid = nameOk && phoneOk && paradigmOk;
  const btn = document.getElementById('btn-submit');

  if (allValid) {
    btn.classList.add('on');
    _buildWaHref();
    if (!_filledFired) {
      _filledFired = true;
      _gaEvent('jk_onboarding_filled', {
        paradigm:       D.paradigm,
        lang:           lang,
        event_category: 'onboarding_funnel',
        event_label:    'all_fields_valid'
      });
    }
  } else {
    btn.classList.remove('on');
  }
}

function _buildWaHref() {
  const msg = encodeURIComponent(t().wa_msg(D.name, D.phone, D.paradigmLabel));
  document.getElementById('btn-submit').href = 'https://wa.me/919760015878?text=' + msg;
}

/* ══════════════════════════════════════════════════
   GUIDE TO MISSING FIELD
   Called when the button is tapped before the form
   is fully valid. Scrolls to and highlights the first
   thing still missing, in priority order.
   ══════════════════════════════════════════════════ */
function _guideToMissingField() {
  if (!D.paradigm) {
    const el = document.getElementById('paradigm-opts');
    el.classList.add('attn-flash');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => el.classList.remove('attn-flash'), 500);
    return;
  }
  if (D.name.length < 2) {
    const el = document.getElementById('f-name');
    const msg = document.getElementById('val-name');
    el.classList.add('attn-flash');
    el.focus();
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    msg.textContent = t().val_name_err;
    msg.className = 'val-msg show err';
    setTimeout(() => el.classList.remove('attn-flash'), 500);
    return;
  }
  if (!(D.phone.length === 10 && /^[6-9]/.test(D.phone))) {
    const el = document.getElementById('f-phone');
    const msg = document.getElementById('val-phone');
    el.classList.add('attn-flash');
    el.focus();
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    msg.textContent = t().val_phone_err;
    msg.className = 'val-msg show err';
    setTimeout(() => el.classList.remove('attn-flash'), 500);
  }
}

/* ══════════════════════════════════════════════════
   FINAL CLICK — the single combined action.
   Opens WhatsApp (native <a> navigation, href already
   built by _buildWaHref), fires jk_onboarding_complete,
   and writes to the Google Sheet — all in one motion.
   If the form isn't valid yet, guides to what's missing
   instead of silently doing nothing.
   ══════════════════════════════════════════════════ */
function onFinalClick(e) {
  const nameOk    = D.name.length >= 2;
  const phoneOk   = D.phone.length === 10 && /^[6-9]/.test(D.phone);
  const paradigmOk = !!D.paradigm;
  if (!(nameOk && phoneOk && paradigmOk)) {
    e.preventDefault();
    _guideToMissingField();
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  _gaEvent('jk_onboarding_complete', {
    paradigm:       D.paradigm,
    paradigm_label: D.paradigmLabel,
    lang:           lang,
    intent:         urlParams.get('intent') || D.paradigm,
    event_category: 'conversion',
    event_label:    'whatsapp_click'
  });

  sendToSheet();
  // No preventDefault — the anchor's href (already built) opens WhatsApp natively.
}

/* ══════════════════════════════════════════════════
   GA4 DISPATCHER
   Primary: direct gtag if available (GitHub Pages direct visit)
   Secondary: postMessage to Carrd parent (embedded visit)
   ══════════════════════════════════════════════════ */
function _gaEvent(eventName, params) {
  try {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
      return;
    }
    window.top.postMessage({ type: 'jk-ga4-event', eventName: eventName, params: params }, '*');
  } catch(e) {}
}

/* ══════════════════════════════════════════════════
   GOOGLE SHEETS RELAY
   Pure background write — event firing happens in
   onFinalClick, not here, since navigation to WhatsApp
   should never wait on this network call.
   ══════════════════════════════════════════════════ */
function sendToSheet() {
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzy6446YnufjDvKZ4KE77nMGEa34CKWWrHMyK8GvYS035VLzHqiiJqjUMygmEVUQuo/exec';
  const urlParams = new URLSearchParams(window.location.search);
  const intentVal = urlParams.get('intent') || D.paradigm;
  const payload = {
    name:    D.name,
    phone:   "'+91 " + D.phone,
    concern: D.paradigmLabel,
    intent:  intentVal,
    ts:      new Date().toISOString()
  };
  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

/* ══════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  // Default to Hindi
  document.getElementById('lang-select').value = 'hi';
  setLang('hi');
  // Intent from URL param (from ad campaigns)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('intent')) D.intent = urlParams.get('intent').trim().toLowerCase();
  // Send initial height immediately, don't wait for observer's first tick
  setTimeout(_broadcastHeight, 100);
});
</script>
