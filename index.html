<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeevanKey — Apni Care Team Banayein</title>

<style>
:root {
  --navy:    #0C447C;
  --navy-d:  #06233f;
  --navy-l:  #12579b;
  --green:   #3B6D11;
  --green-d: #24440a;
  --green-l: #539719;
  --white:   #ffffff;
  --off:     #8EDBF5;
  --ink:     #111b24;
  --ink-2:   #2c3a46;
  --ink-3:   #526371;
  --ink-4:   #8ea1b0;
  --wa:      #25D366;
  --wa-d:    #1aab53;
  --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --ease:    cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--off);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(12,68,124,0.08);
  padding: 36px 28px 28px;
}

/* ── Brand bar ── */
.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.brand-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-logo {
  font-size: 19px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: -.02em;
}
.brand-logo span { color: var(--green); }
.brand-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-4); }
.brand-tag { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

/* ── Language selector ── */
.lang-select {
  font-size: 12px;
  color: var(--ink-2);
  border: 1.5px solid #d2dbe1;
  border-radius: 6px;
  padding: 5px 8px;
  background: var(--white);
  cursor: pointer;
  font-family: var(--sans);
}

/* ── Steps ── */
.step { display: none; }
.step.active { display: block; animation: fadeUp .3s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.step-q {
  font-size: 19px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
  margin-bottom: 6px;
}
.step-hint {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 18px;
  line-height: 1.5;
}
.hi-name { color: var(--green); font-weight: 700; }

/* ── Field group labels (single-page layout) ── */
.field-label {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
  line-height: 1.3;
}
.field-group { margin-top: 22px; }

/* ── Text input ── */
.field-wrap { margin-bottom: 4px; }
.field-input {
  width: 100%;
  padding: 13px 14px;
  font-size: 15px;
  font-family: var(--sans);
  border: 1.5px solid #d2dbe1;
  border-radius: 8px;
  color: var(--ink);
  background: var(--white);
  transition: border-color .2s;
  outline: none;
}
.field-input:focus { border-color: var(--navy); }
.field-input.valid { border-color: var(--green); }

/* ── Phone wrap ── */
.phone-wrap { display: flex; }
.phone-code {
  padding: 13px 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  background: #edf2f5;
  border: 1.5px solid #d2dbe1;
  border-right: none;
  border-radius: 8px 0 0 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.field-input.phone-input { border-radius: 0 8px 8px 0; }

/* ── Validation message ── */
.val-msg { font-size: 12px; color: var(--green); margin-top: 6px; display: none; }
.val-msg.show { display: block; }
.val-msg.err { color: #d32f2f; }

/* ── Phone safety reassurance ── */
.phone-safety-note {
  font-size: 12px;
  color: var(--green-d);
  margin-top: 7px;
  line-height: 1.4;
  display: flex;
  align-items: flex-start;
  gap: 5px;
}
.phone-safety-note::before {
  content: '🔒';
  font-size: 11px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── Options (Q0 paradigm) ── */
.opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--white);
  border: 1.5px solid #d2dbe1;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--sans);
  text-align: left;
  width: 100%;
  transition: all .2s var(--ease);
}
.opt:hover { border-color: var(--green-l); background: #fbfdfa; }
.opt.sel { border-color: var(--green); background: #f4faf0; }
.opt-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.opt-body { display: flex; flex-direction: column; gap: 3px; }
.opt-main { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.opt.sel .opt-main { color: var(--green-d); }
.opt-sub { font-size: 12px; color: var(--ink-4); line-height: 1.4; }

/* ── Consent notice ── */
.consent-note {
  font-size: 11px;
  color: var(--ink-4);
  line-height: 1.5;
  margin-top: 18px;
}

/* ── Next button ── */
.next-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 24px;
  margin-top: 16px;
  background: var(--navy);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s var(--ease);
  opacity: 0;
  pointer-events: none;
}
.next-btn.on { opacity: 1; pointer-events: all; }
.next-btn:hover { background: var(--navy-l); }
.next-arrow { transition: transform .2s; }
.next-btn:hover .next-arrow { transform: translateX(3px); }

/* ── Summary (done screen) ── */
#step-done { text-align: center; }
.done-icon { font-size: 42px; margin-bottom: 14px; }
.done-h { font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.done-sub { font-size: 13.5px; color: var(--ink-3); line-height: 1.6; margin-bottom: 20px; }

.summary {
  background: #f8fafc;
  border: 1.5px solid #edf2f5;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
  text-align: left;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 7px 0;
  font-size: 13.5px;
  border-bottom: 1px solid #edf2f5;
  gap: 12px;
}
.summary-row:last-child { border-bottom: none; }
.summary-key { color: var(--ink-3); flex-shrink: 0; }
.summary-val { color: var(--ink); font-weight: 600; text-align: right; }

.done-wa {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 24px;
  background: var(--wa);
  color: var(--white);
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition: background .2s;
}
.done-wa:hover { background: var(--wa-d); }

.disclaimer {
  font-size: 10.5px;
  color: var(--ink-4);
  line-height: 1.5;
  margin-top: 18px;
}

@media (max-width: 480px) {
  .wrap { padding: 24px 18px 20px; border-radius: 0; min-height: 100vh; }
  .step-q { font-size: 17px; }
}
</style>

      <option value="ml">മലയാളം</option>
    </select>
  </div>

  <!-- ══ SINGLE FORM: Paradigm + Name + Phone ══ -->
  <div class="step active" id="step-form">
    <p class="step-q" id="q-paradigm"></p>
    <p class="step-hint" id="h-paradigm"></p>
    <div class="opts" id="paradigm-opts">
      <!-- options injected by renderParadigmOpts() -->
    </div>

    <div class="field-group">
      <div class="field-label" id="lbl-name-field"></div>
      <div class="field-wrap">
        <input class="field-input" type="text" id="f-name"
          autocomplete="given-name" autocapitalize="words" maxlength="40"
          oninput="onName(this)"
          onkeydown="if(event.key==='Enter'){ document.getElementById('f-phone').focus(); }">
        <div class="val-msg" id="val-name"></div>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label" id="lbl-phone-field"></div>
      <div class="field-wrap">
        <div class="phone-wrap">
          <div class="phone-code">🇮🇳 +91</div>
          <input class="field-input phone-input" type="tel" id="f-phone"
            maxlength="10" inputmode="numeric" pattern="[0-9]*"
            oninput="onPhone(this)"
            onkeydown="if(event.key==='Enter') trySubmit()">
        </div>
        <div class="val-msg" id="val-phone"></div>
        <div class="phone-safety-note" id="phone-safety-note"></div>
      </div>
    </div>

    <p class="consent-note" id="consent-note"></p>

    <button class="next-btn" id="btn-submit" onclick="submit()">
      <span id="btn-submit-label"></span> <span class="next-arrow">→</span>
    </button>
  </div>

  <!-- ══ DONE ══ -->
  <div class="step" id="step-done">
    <div class="done-icon">🚀</div>
    <h2 class="done-h" id="done-h"></h2>
    <p class="done-sub" id="done-sub"></p>
    <div class="summary">
      <div class="summary-row">
        <span class="summary-key" id="lbl-name"></span>
        <span class="summary-val" id="s-name"></span>
      </div>
      <div class="summary-row">
        <span class="summary-key" id="lbl-wa"></span>
        <span class="summary-val" id="s-phone"></span>
      </div>
      <div class="summary-row">
        <span class="summary-key" id="lbl-track"></span>
        <span class="summary-val" id="s-paradigm"></span>
      </div>
    </div>
    <a class="done-wa" id="done-wa-btn" href="#" target="_blank" onclick="onWaClick()">
      💬 <span id="wa-btn-label"></span>
    </a>
    <p class="disclaimer" id="disclaimer-text"></p>
  </div>

</div>

/* ══════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════ */
function t() { return T[lang] || T.hi; }

/* ══════════════════════════════════════════════════
   LANGUAGE SWITCH
   ══════════════════════════════════════════════════ */
function setLang(l) {
  lang = l;
  document.getElementById('brand-tag').textContent = t().brand_tag;

  document.getElementById('q-paradigm').textContent = t().q_paradigm;
  document.getElementById('h-paradigm').textContent = t().h_paradigm;
  renderParadigmOpts();

  document.getElementById('lbl-name-field').textContent = t().lbl_name_field;
  document.getElementById('f-name').placeholder = t().placeholder_name;

  document.getElementById('lbl-phone-field').textContent = t().lbl_phone_field;
  document.getElementById('f-phone').placeholder = t().placeholder_phone;
  document.getElementById('phone-safety-note').textContent = t().phone_safety_note;

  document.getElementById('consent-note').textContent = t().consent_note;
  document.getElementById('btn-submit-label').textContent = t().btn_connect;
}

/* ══════════════════════════════════════════════════
   FIELD VALIDATION — NAME
   ══════════════════════════════════════════════════ */
function onName(el) {
  const v = el.value.trim();
  D.name = v;
  const msg = document.getElementById('val-name');
  if (v.length >= 2) {
    el.classList.add('valid');
    msg.textContent = t().val_name_ok;
    msg.className = 'val-msg show';
    if (!_stepFired.name) {
      _stepFired.name = true;
      _gaEvent('jk_onboarding_step', {
        step: 'name_entered',
        event_category: 'onboarding_funnel',
        event_label: 'step_name'
      });
    }
  } else {
    el.classList.remove('valid');
    msg.className = 'val-msg';
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   FIELD VALIDATION — PHONE
   ══════════════════════════════════════════════════ */
function onPhone(el) {
  el.value = el.value.replace(/\D/g, '').slice(0, 10);
  const v = el.value;
  D.phone = v;
  const msg = document.getElementById('val-phone');
  if (v.length === 10 && /^[6-9]/.test(v)) {
    el.classList.add('valid');
    msg.textContent = t().val_phone_ok;
    msg.className = 'val-msg show';
    if (!_stepFired.phone) {
      _stepFired.phone = true;
      _gaEvent('jk_onboarding_step', {
        step: 'phone_entered',
        event_category: 'onboarding_funnel',
        event_label: 'step_phone'
      });
    }
  } else if (v.length === 10) {
    el.classList.remove('valid');
    msg.textContent = t().val_phone_err;
    msg.className = 'val-msg show err';
  } else {
    el.classList.remove('valid');
    msg.className = 'val-msg';
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   PARADIGM SELECTION
   ══════════════════════════════════════════════════ */
function renderParadigmOpts() {
  const container = document.getElementById('paradigm-opts');
  const opts = t().paradigm_opts;
  container.innerHTML = opts.map(o => `
    <button class="opt${D.paradigm === o.val ? ' sel' : ''}"
      onclick="pickParadigm(this,'${o.val}')" type="button">
      <span class="opt-icon">${o.icon}</span>
      <span class="opt-body">
        <span class="opt-main">${o.main}</span>
        <span class="opt-sub">${o.sub}</span>
      </span>
    </button>
  `).join('');
}

function pickParadigm(el, val) {
  D.paradigm = val;
  const opt = t().paradigm_opts.find(o => o.val === val);
  D.paradigmLabel = opt ? opt.main : val;
  document.querySelectorAll('#paradigm-opts .opt').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  if (!_stepFired.paradigm) {
    _stepFired.paradigm = true;
    _gaEvent('jk_onboarding_step', {
      step: 'paradigm_selected',
      paradigm: val,
      event_category: 'onboarding_funnel',
      event_label: 'step_paradigm'
    });
  }
  checkAllValid();
}

/* ══════════════════════════════════════════════════
   COMBINED VALIDATION — all three fields must be valid
   ══════════════════════════════════════════════════ */
function checkAllValid() {
  const nameOk    = D.name.length >= 2;
  const phoneOk   = D.phone.length === 10 && /^[6-9]/.test(D.phone);
  const paradigmOk = !!D.paradigm;
  const btn = document.getElementById('btn-submit');
  if (nameOk && phoneOk && paradigmOk) {
    btn.classList.add('on');
  } else {
    btn.classList.remove('on');
  }
}

function trySubmit() {
  const nameOk    = D.name.length >= 2;
  const phoneOk   = D.phone.length === 10 && /^[6-9]/.test(D.phone);
  const paradigmOk = !!D.paradigm;
  if (nameOk && phoneOk && paradigmOk) submit();
}

/* ══════════════════════════════════════════════════
   SUBMIT → DONE SCREEN
   ══════════════════════════════════════════════════ */
function submit() {
  if (!D.paradigm || D.name.length < 2 || !(D.phone.length === 10 && /^[6-9]/.test(D.phone))) return;

  // Populate done screen
  document.getElementById('done-h').textContent = t().done_h(D.name);
  document.getElementById('done-sub').textContent = t().done_sub;
  document.getElementById('lbl-name').textContent = t().lbl_name;
  document.getElementById('lbl-wa').textContent = t().lbl_wa;
  document.getElementById('lbl-track').textContent = t().lbl_track;
  document.getElementById('s-name').textContent = D.name;
  document.getElementById('s-phone').textContent = '+91 ' + D.phone;
  document.getElementById('s-paradigm').textContent = D.paradigmLabel;
  document.getElementById('wa-btn-label').textContent = t().wa_btn;
  document.getElementById('disclaimer-text').textContent = t().disclaimer;

  // Build pre-filled WhatsApp message
  const msg = encodeURIComponent(t().wa_msg(D.name, D.phone, D.paradigmLabel));
  document.getElementById('done-wa-btn').href = 'https://wa.me/919760015878?text=' + msg;

  // Transition
  document.getElementById('step-form').classList.remove('active');
  document.getElementById('step-done').classList.add('active');

  // Google Sheets relay + GA4 lead event
  sendToSheet();
}

/* ══════════════════════════════════════════════════
   GA4 DISPATCHER
   Primary: direct gtag if available (GitHub Pages direct visit)
   Secondary: postMessage to Carrd parent (embedded visit)
   ══════════════════════════════════════════════════ */
function _gaEvent(eventName, params) {
  try {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
      return;
    }
    window.top.postMessage({ type: 'jk-ga4-event', eventName: eventName, params: params }, '*');
  } catch(e) {}
}

/* ══════════════════════════════════════════════════
   GOOGLE SHEETS RELAY
   ══════════════════════════════════════════════════ */
function sendToSheet() {
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzy6446YnufjDvKZ4KE77nMGEa34CKWWrHMyK8GvYS035VLzHqiiJqjUMygmEVUQuo/exec';
  const urlParams = new URLSearchParams(window.location.search);
  const intentVal = urlParams.get('intent') || D.paradigm;
  const payload = {
    name:    D.name,
    phone:   "'+91 " + D.phone,
    concern: D.paradigmLabel,
    intent:  intentVal,
    ts:      new Date().toISOString()
  };
  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    _gaEvent('jk_onboarding_complete', {
      paradigm:       D.paradigm,
      paradigm_label: D.paradigmLabel,
      lang:           lang,
      intent:         intentVal,
      event_category: 'onboarding_funnel',
      event_label:    'sheet_write_success'
    });
  })
  .catch(() => {
    _gaEvent('jk_onboarding_complete', {
      paradigm:       D.paradigm,
      paradigm_label: D.paradigmLabel,
      lang:           lang,
      intent:         intentVal,
      event_category: 'onboarding_funnel',
      event_label:    'sheet_write_failed'
    });
  });
}

/* ══════════════════════════════════════════════════
   WHATSAPP CLICK — PRIMARY CONVERSION EVENT
   Mark jk_onboarding_whatsapp_initiated as a
   Conversion in GA4 and primary Google Ads conversion.
   ══════════════════════════════════════════════════ */
function onWaClick() {
  _gaEvent('jk_onboarding_whatsapp_initiated', {
    paradigm:       D.paradigm,
    paradigm_label: D.paradigmLabel,
    lang:           lang,
    intent:         new URLSearchParams(window.location.search).get('intent') || D.paradigm,
    event_category: 'conversion',
    event_label:    'onboarding_whatsapp_cta'
  });
}

/* ══════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  // Default to Hindi
  document.getElementById('lang-select').value = 'hi';
  setLang('hi');
  // Intent from URL param (from ad campaigns)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('intent')) D.intent = urlParams.get('intent').trim().toLowerCase();
});
</script>
